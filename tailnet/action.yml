name: tailnet
description: >-
  Joins Shane's tailnet as an ephemeral tag:ci node, trusted through GitHub's
  OIDC, so the job holds no Tailscale secret. For GitHub-hosted runners.
inputs:
  client-id:
    description: The federated identity's client ID, from a repository variable.
    required: true
  audience:
    description: The federated identity's audience, api.tailscale.com/<client ID>.
    required: true
runs:
  using: composite
  steps:
    - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.client-id }}
        audience: ${{ inputs.audience }}
        tags: tag:ci
