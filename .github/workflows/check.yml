# Runs the caller's scripts/check.sh in its flake's dev shell on a hosted
# runner: the same gate its agents' hooks and pre-commit run, so nothing
# they'd have caught lands by a route that skips them. The shell carries
# every tool the script calls, pulled from the public caches, and a tool
# none of them has, like an unfree one, compiles here on every run.
on:
  workflow_call:
    secrets:
      INPUTS_TOKEN:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}

      - name: scripts/check.sh
        run: nix --option warn-dirty false develop --command scripts/check.sh
