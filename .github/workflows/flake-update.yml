# `nix flake update` of every input, or just the ones named, on a hosted
# runner. Pushes the bump first and opens a pull request for it as the
# caller's GitHub App (or refreshes the open one), so the caller's pull
# request checks run on its real head from the start, and the App can ask
# the reviewer, which a pull request's own author can't. Then it fills the
# description in with each moved input and the changelogs the caller's notes
# script prints. It builds nothing: the caller's hosts.yml run on the pull
# request says which hosts change and builds them. The caller owns the
# schedule and the concurrency group, so a second run cancels the first
# rather than racing it to push.
on:
  workflow_call:
    inputs:
      title:
        description: Title of the pull request.
        type: string
        default: "flake.lock: update every input"
      reviewer:
        description: Who to ask for a review once the description is done. Empty asks no one.
        type: string
        default: shaneplunkett
      branch:
        description: Branch the update is pushed to.
        type: string
        default: update/flake-lock
      notes:
        description: >-
          Script in the caller's repo that prints changelogs as markdown, given
          the old and new flake.lock. Empty leaves the Changelogs section out.
        type: string
        default: ""
      only:
        description: Flake inputs to update, space-separated. Empty updates every input.
        type: string
        default: ""
    secrets:
      INPUTS_TOKEN:
        required: true
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: ${{ inputs.branch }}
      REVIEWER: ${{ inputs.reviewer }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      ONLY: ${{ inputs.only }}
      MAIN: ${{ github.event.repository.default_branch }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update the lock file
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          work="$(mktemp -d)"
          echo "WORK=$work" >> "$GITHUB_ENV"
          # The commit is the App's, so GitHub shows it as the App and the
          # mirror takes it: the bot user's noreply address carries its id.
          id="$(gh api "users/$SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "$id+${SLUG}[bot]@users.noreply.github.com"
          read -ra only <<< "$ONLY"
          nix flake update "${only[@]}" --commit-lock-file
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "Everything is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push it and open or refresh the pull request
        id: pr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraHeader="Authorization: Basic $basic" \
            push --force "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

          body="⏳ [Update run #$GITHUB_RUN_NUMBER]($RUN) is reading the changelogs. The input changes and changelogs appear here when it finishes."
          number="$(gh pr list --head "$BRANCH" --base "$MAIN" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            number="$(gh pr create --head "$BRANCH" --base "$MAIN" --title "$TITLE" --body "$body" \
              | sed -E 's|.*/pull/([0-9]+)$|\1|')"
            echo "Opened pull request #$number."
          else
            gh pr edit "$number" --title "$TITLE" --body "$body" > /dev/null
            echo "Refreshed pull request #$number."
          fi
          echo "NUMBER=$number" >> "$GITHUB_ENV"

      - name: List the input changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git show HEAD~1:flake.lock > "$WORK/old.lock"
          jq -r --slurpfile old "$WORK/old.lock" '
            .nodes as $nodes
            | .nodes.root.inputs | to_entries[]
            | .key as $name
            | $nodes[.value].locked as $new
            | ($old[0].nodes[$old[0].nodes.root.inputs[$name]].locked // {}) as $was
            | select($was.rev != null and $was.rev != $new.rev)
            | [$name, $new.type, ($new.url // "\($new.owner)/\($new.repo)"), $was.rev, $new.rev]
            | @tsv' flake.lock > "$WORK/moved.tsv"

          while IFS=$'\t' read -r name type source was now; do
            if [ "$type" = github ]; then
              echo "**$name**: [${was:0:7}...${now:0:7}](https://github.com/$source/compare/$was...$now)" >> "$WORK/inputs.md"
            else
              git clone -q --bare --filter=blob:none "$source" "$WORK/$name.git"
              printf '**%s**\n%s\n' "$name" "$(git -C "$WORK/$name.git" log --format='- %h %s' "$was..$now")" >> "$WORK/inputs.md"
            fi
            echo >> "$WORK/inputs.md"
          done < "$WORK/moved.tsv"

      - name: Read the changelogs
        id: notes
        if: steps.update.outputs.changed == 'true' && inputs.notes != ''
        continue-on-error: true
        run: ./"$NOTES" "$WORK/old.lock" flake.lock > "$WORK/notes.md"

      - name: Fill in the pull request
        if: ${{ !cancelled() && steps.pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          inputs="$(cat "$WORK/inputs.md" 2> /dev/null || echo "None of this flake's own inputs moved.")"
          if [ -n "$NOTES" ]; then
            notes="$(cat "$WORK/notes.md" 2> /dev/null || echo "Couldn't read the changelogs. [Update run #$GITHUB_RUN_NUMBER]($RUN) has the error.")"
            notes="$(printf '### Changelogs\n\nAsk an agent to triage these with the flake-update skill.\n\n%s' "$notes")"$'\n\n'
          else
            notes=""
          fi
          lock="$(git log -1 --format=%b)"
          body="$(printf '%s### Input changes\n\n%s\n\n<details>\n<summary>Lock file</summary>\n\n%s\n\n</details>' \
            "$notes" "$inputs" "$lock")"
          gh pr edit "$NUMBER" --body "$body" > /dev/null
          echo "Filled in pull request #$NUMBER."

          if [ -n "$REVIEWER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/requested_reviewers" -f "reviewers[]=$REVIEWER" > /dev/null
            echo "Asked $REVIEWER to review it."
          fi

      - name: Fail if the changelogs couldn't be read
        if: steps.notes.outcome == 'failure'
        run: exit 1
