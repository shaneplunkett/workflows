# Works out the caller's derivation diff on GitHub: the hosts whose system
# derivation differs between a baseline and the head. On a pull request the
# baseline is its merge base; with `build` on, a push to main compares with
# the commit before it too. A whole colmena hive can outgrow a hosted
# runner's 16 GB, so each host is evaluated on its own runner. The baseline
# comes from the mapping main uploaded for it as an artifact, or, with none,
# from a matrix of its own that runs before the head's. With `build` on,
# each head job then builds its host, when it changed and the runner can
# build it, from the derivation it just evaluated, and pushes the closure to
# the caller's Attic over the tailnet. The hosts job gathers every job's
# result, posts the diff on a pull request as one comment from the caller's
# GitHub App, edited on each push, and on a push to main uploads the mapping
# as an artifact named for the commit.
on:
  workflow_call:
    inputs:
      build:
        description: Build each changed host the runner can build, and push it to the cache.
        type: boolean
        default: false
      tailnet-client-id:
        description: The Tailscale federated identity's client ID, for joining the tailnet to reach the cache.
        type: string
        default: ""
      tailnet-audience:
        description: The federated identity's audience, api.tailscale.com/<client ID>.
        type: string
        default: ""
      cache-endpoint:
        description: Attic's address on the tailnet, without the cache's name, like http://cache.example.ts.net:8080.
        type: string
        default: ""
      cache-name:
        description: The Attic cache to pull from and push to.
        type: string
        default: ""
      cache-public-key:
        description: The cache's signing key, as Nix trusts it.
        type: string
        default: ""
      attic-client:
        description: The installable for the Attic client, read with the caller's flake's inputs.
        type: string
        default: nixpkgs#attic-client
    secrets:
      INPUTS_TOKEN:
        required: true
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      ATTIC_PULL_TOKEN:
        required: false
      ATTIC_PUSH_TOKEN:
        required: false

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      hosts: ${{ steps.head.outputs.hosts }}
      base: ${{ steps.base.outputs.sha }}
      base-run: ${{ steps.base.outputs.run }}
      base-hosts: ${{ steps.base.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: List every host
        id: head
        run: echo "hosts=$(nix eval --json .#hydraJobs --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
      - name: Find the baseline's mapping
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUILD: ${{ inputs.build }}
          MAIN: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$PR_HEAD" --jq .merge_base_commit.sha)"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = "refs/heads/$MAIN" ] && [ "$BUILD" = true ]; then
            if [[ "$BEFORE" =~ ^0*$ ]]; then
              echo "No commit before this push, so every host counts as changed."
            else
              base="$BEFORE"
            fi
          fi
          [ -n "$base" ] || exit 0
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          # Only a push to main uploads a mapping, and only main's runs are
          # trusted, since a pull request's run could upload one by the same
          # name.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hosts-$base" --jq '
            [.artifacts[] | select((.expired | not)
              and .workflow_run.head_branch == env.MAIN
              and .workflow_run.head_repository_id == .workflow_run.repository_id)]
            | .[0].workflow_run.id // empty')"
          if [ -n "$run" ]; then
            echo "Using the mapping run $run uploaded for $base."
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            echo "No mapping for $base, so it's evaluated before the head."
            echo "hosts=$(nix eval --json "github:$GITHUB_REPOSITORY/$base#hydraJobs" --apply builtins.attrNames)" \
              >> "$GITHUB_OUTPUT"
          fi

  # Runs before the head rather than beside it, so a run with no mapping
  # for its baseline never holds two matrices' worth of runners at once,
  # and each head job knows whether its host changed.
  evaluate-base:
    needs: list
    if: needs.list.outputs.base != '' && needs.list.outputs.base-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.base-hosts) }}
    env:
      HOST: ${{ matrix.host }}
      SIDE: base
      REF: ${{ needs.list.outputs.base }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - &nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      # The action's pin pins Nix too, to 2.35.4, which writes each
      # derivation to the store as it evaluates, so the head's build
      # realises the derivation this step printed without evaluating again.
      - &evaluate
        name: Evaluate
        id: evaluate
        run: |
          out="$(mktemp -d)"
          status=0
          /usr/bin/time -f '%M %e' -o "$out/stats" \
            nix eval --raw ".#hydraJobs.$HOST.drvPath" > "$out/drv" || status=$?
          read -r rss elapsed < <(tail -1 "$out/stats")
          peak="$(awk -v kb="$rss" 'BEGIN { printf "%.2f GiB", kb / 1048576 }')"
          if [ "$status" -eq 0 ]; then
            nix-store --check-validity "$(< "$out/drv")" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/$SIDE/drv"
            jq -n --arg host "$HOST" --rawfile drv "$out/drv" '{($host): $drv}' > "$RUNNER_TEMP/$SIDE/drv/$HOST.json"
            echo "drv=$(< "$out/drv")" >> "$GITHUB_OUTPUT"
            drv="\`$(< "$out/drv")\`"
          else
            drv="evaluation failed with status $status"
          fi
          echo "$HOST at the $SIDE: $drv, peak $peak, elapsed ${elapsed}s"
          {
            echo "### $HOST at the $SIDE"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$REF\` |"
            echo "| Derivation | $drv |"
            echo "| Peak memory | $peak |"
            echo "| Elapsed | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        timeout-minutes: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-${{ env.HOST }}
          path: ${{ runner.temp }}/base/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Takes the caller's permissions rather than naming its own, since asking
  # for id-token here would fail every caller that doesn't build.
  evaluate:
    needs: [list, evaluate-base]
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host }}
      SIDE: head
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # A rerun keeps the artifacts of an earlier attempt, and an upload that
      # never runs leaves the old one in place. So every record this job
      # uploads carries its attempt, and the hosts job only counts one that
      # matches this marker, uploaded before anything can fail.
      - name: Mark this attempt
        run: |
          mkdir -p "$RUNNER_TEMP/start"
          jq -n '{(env.HOST): (env.GITHUB_RUN_ATTEMPT | tonumber)}' > "$RUNNER_TEMP/start/$HOST.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-${{ env.HOST }}
          path: ${{ runner.temp }}/start/${{ env.HOST }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - *checkout
      - *nix
      - *evaluate

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.list.outputs.base-run != ''
        with:
          name: hosts-${{ needs.list.outputs.base }}
          run-id: ${{ needs.list.outputs.base-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.evaluate-base.result != 'skipped'
        with:
          pattern: base-*
          merge-multiple: true
          path: ${{ runner.temp }}/baseline
      - name: Compare with the baseline
        id: plan
        env:
          DRV: ${{ steps.evaluate.outputs.drv }}
          # A fork's pull request gets no secrets and no OIDC token, so it
          # never builds.
          BUILD: ${{ inputs.build && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/baseline/*.json "$RUNNER_TEMP"/baseline/drv/*.json)
          base=""
          if [ "${#files[@]}" -gt 0 ]; then
            base="$(jq -rs 'add | .[env.HOST] // empty' "${files[@]}")"
          fi
          # A derivation with structured attributes keeps no `system` in its
          # environment, so it's read from the derivation itself.
          system="$(nix derivation show "$DRV" | jq -r '[.. | objects | .system? | strings] | first')"
          changed=false
          [ "$base" = "$DRV" ] || changed=true
          build=false
          if [ "$BUILD" = true ] && [ "$changed" = true ] && [ "$system" = "$(nix config show system)" ]; then
            build=true
          fi
          mkdir -p "$RUNNER_TEMP/head/plan"
          jq -n --arg system "$system" --argjson changed "$changed" --argjson build "$build" \
            '{(env.HOST): {$system, $changed, $build, attempt: (env.GITHUB_RUN_ATTEMPT | tonumber)}}' \
            > "$RUNNER_TEMP/head/plan/$HOST.json"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "$HOST: changed $changed, system $system, build $build"
          printf '\nChanged: %s. System: %s. Builds: %s.\n' "$changed" "\`$system\`" "$build" >> "$GITHUB_STEP_SUMMARY"
      # Uploaded before the build, so a build that fails or runs out of time
      # still leaves this host's evaluation in the diff.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: head-${{ env.HOST }}
          path: ${{ runner.temp }}/head/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Reclaim disk
        if: steps.plan.outputs.build == 'true'
        run: |
          df -h --output=avail / | tail -1 | xargs echo "Free before reclaiming:"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/*
          sudo docker image prune --all --force > /dev/null
          df -h --output=avail / | tail -1 | xargs echo "Free after reclaiming:"
      - uses: shaneplunkett/workflows/tailnet@v2.0.0
        if: steps.plan.outputs.build == 'true'
        with:
          client-id: ${{ inputs.tailnet-client-id }}
          audience: ${{ inputs.tailnet-audience }}
      - name: Pull from the cache
        if: steps.plan.outputs.build == 'true'
        env:
          ENDPOINT: ${{ inputs.cache-endpoint }}
          NAME: ${{ inputs.cache-name }}
          KEY: ${{ inputs.cache-public-key }}
          TOKEN: ${{ secrets.ATTIC_PULL_TOKEN }}
        run: |
          for var in ENDPOINT NAME KEY TOKEN; do
            test -n "${!var}" || { echo "::error::$var is empty, so this host can't build."; exit 1; }
          done
          # Nix matches a netrc entry by host alone, and Attic takes the
          # token as a password.
          host="${ENDPOINT#*://}"
          host="${host%%[:/]*}"
          netrc="$RUNNER_TEMP/netrc"
          (umask 077 && printf 'machine %s\npassword %s\n' "$host" "$TOKEN" > "$netrc")
          printf 'extra-substituters = %s\nextra-trusted-public-keys = %s\nnetrc-file = %s\n' \
            "$ENDPOINT/$NAME" "$KEY" "$netrc" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          nix store info --store "$ENDPOINT/$NAME"
      - name: Build
        id: build
        if: steps.plan.outputs.build == 'true'
        env:
          DRV: ${{ steps.evaluate.outputs.drv }}
        run: |
          plan="$(mktemp)"
          nix build --dry-run "$DRV^*" 2> "$plan" || { cat "$plan"; exit 1; }
          cat "$plan"
          read -r builds fetches < <(awk '
            /will be built:$/ { side = "b"; next }
            /will be fetched/ { side = "f"; next }
            /^  \/nix\/store\// { n[side]++ }
            END { print n["b"] + 0, n["f"] + 0 }' "$plan")
          echo "$HOST builds $builds derivations and fetches $fetches paths."
          printf '\nPlanned to build %s derivations and fetch %s paths.\n' "$builds" "$fetches" >> "$GITHUB_STEP_SUMMARY"
          out="$(nix build --no-link --print-out-paths "$DRV^*")"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          printf '\nBuilt %s.\n' "\`$out\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Push to the cache
        if: steps.plan.outputs.build == 'true'
        env:
          ENDPOINT: ${{ inputs.cache-endpoint }}
          NAME: ${{ inputs.cache-name }}
          TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
          CLIENT: ${{ inputs.attic-client }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          test -n "$TOKEN" || { echo "::error::ATTIC_PUSH_TOKEN is empty, so this host can't push."; exit 1; }
          attic="$(nix build --no-link --print-out-paths --inputs-from . "$CLIENT")/bin/attic"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/attic"
          install -d -m 700 "$XDG_CONFIG_HOME" "$XDG_CONFIG_HOME/attic"
          (umask 077 && printf 'default-server = "ci"\n[servers.ci]\nendpoint = "%s/"\ntoken = "%s"\n' \
            "$ENDPOINT" "$TOKEN" > "$XDG_CONFIG_HOME/attic/config.toml")
          "$attic" push "ci:$NAME" "$OUT"
          mkdir -p "$RUNNER_TEMP/built"
          jq -n --arg out "$OUT" '{(env.HOST): {$out, attempt: (env.GITHUB_RUN_ATTEMPT | tonumber)}}' \
            > "$RUNNER_TEMP/built/$HOST.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.build == 'true'
        with:
          name: built-${{ env.HOST }}
          path: ${{ runner.temp }}/built/${{ env.HOST }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  hosts:
    needs: [list, evaluate-base, evaluate]
    # A skipped job passes as a required check, so this one runs whatever
    # happened before it and fails itself when an evaluation, a build or a
    # push did.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: start-*
          merge-multiple: true
          path: ${{ runner.temp }}/start
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: head-*
          merge-multiple: true
          path: ${{ runner.temp }}/head
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: ${{ runner.temp }}/built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.list.outputs.base-run != ''
        with:
          name: hosts-${{ needs.list.outputs.base }}
          run-id: ${{ needs.list.outputs.base-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.evaluate-base.result != 'skipped'
        with:
          pattern: base-*
          merge-multiple: true
          path: ${{ runner.temp }}/baseline

      - name: Work out the diff
        id: diff
        env:
          LIST: ${{ needs.list.result }}
          EVALUATE: ${{ needs.evaluate.result }}
          EVALUATE_BASE: ${{ needs.evaluate-base.result }}
          HOSTS: ${{ needs.list.outputs.hosts }}
          BASE: ${{ needs.list.outputs.base }}
          BASE_RUN: ${{ needs.list.outputs.base-run }}
          BASE_HOSTS: ${{ needs.list.outputs.base-hosts }}
          BUILD: ${{ inputs.build }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shopt -s nullglob
          merge() { if [ "$#" -eq 0 ]; then echo '{}'; else jq -s add "$@"; fi; }
          merge "$RUNNER_TEMP"/start/*.json > "$RUNNER_TEMP/start.json"
          merge "$RUNNER_TEMP"/head/drv/*.json > "$RUNNER_TEMP/head-all.json"
          merge "$RUNNER_TEMP"/head/plan/*.json > "$RUNNER_TEMP/plan-all.json"
          merge "$RUNNER_TEMP"/built/*.json > "$RUNNER_TEMP/built-all.json"
          merge "$RUNNER_TEMP"/baseline/*.json "$RUNNER_TEMP"/baseline/drv/*.json > "$RUNNER_TEMP/base.json"
          cd "$RUNNER_TEMP"

          # Only a host's records from its latest attempt count. The mapping
          # and plan share an artifact, so they share the plan's attempt.
          current() { jq --slurpfile start start.json 'with_entries(select(.value.attempt == $start[0][.key]))' "$1"; }
          current plan-all.json > plan.json
          current built-all.json > built.json
          jq --slurpfile plan plan.json 'with_entries(select(.key | in($plan[0])))' head-all.json > head.json

          absent() { jq -c --slurpfile have "$2" '[.[] | select(. as $h | $have[0] | has($h) | not)]' <<< "$1"; }
          missing="$(absent "${HOSTS:-[]}" head.json)"
          base_missing="$(absent "${BASE_HOSTS:-[]}" base.json)"
          base_failed=false
          if [ "$EVALUATE_BASE" = failure ] || [ "$EVALUATE_BASE" = cancelled ]; then base_failed=true; fi
          changed="$(jq -c --slurpfile base base.json --argjson unknown "$base_missing" \
            '[to_entries[] | select(.value != $base[0][.key]) | .key | select(IN($unknown[]) | not)]' head.json)"
          removed="$(jq -c --argjson hosts "${HOSTS:-[]}" '[keys[] | select(IN($hosts[]) | not)]' base.json)"
          planned="$(jq -c '[to_entries[] | select(.value.build) | .key]' plan.json)"
          failed="$(absent "$planned" built.json)"
          built="$(jq -c 'keys' built.json)"
          unbuilt="$(jq -r --argjson changed "$changed" \
            '[to_entries[] | select(.key | IN($changed[])) | select(.value.build | not) | "`\(.key)` (\(.value.system))"] | join(", ")' plan.json)"
          echo "Changed: $changed"
          echo "Removed: $removed"
          echo "Built: $built"
          echo "Failed to build or push: $failed"
          echo "Didn't evaluate: head $missing, base $base_missing (baseline matrix $EVALUATE_BASE)"

          list() { jq -r 'map("`\(.)`") | join(", ")' <<< "$1"; }
          count() { jq length <<< "$1"; }
          complete=true
          if [ "$LIST" != success ] || [ "$missing" != "[]" ] || [ "$base_missing" != "[]" ] || [ "$base_failed" = true ]; then
            complete=false
          fi
          unexplained=false
          if [ "$complete" = true ] && [ "$failed" = "[]" ] && [ "$EVALUATE" != success ]; then
            unexplained=true
          fi

          if [ "$LIST" != success ]; then
            summary="**The host list didn't evaluate, so there's no diff.**"
          else
            if [ "$complete" = true ]; then
              case "$(count "$changed")" in
                0) summary="**No hosts change.**" ;;
                1) summary="**1 host changes:** $(list "$changed")" ;;
                *) summary="**$(count "$changed") hosts change:** $(list "$changed")" ;;
              esac
            else
              unknown=""
              [ "$missing" = "[]" ] || unknown="$(list "$missing") at the head"
              [ "$missing" = "[]" ] || [ "$base_missing" = "[]" ] || unknown="$unknown, and "
              [ "$base_missing" = "[]" ] || unknown="$unknown$(list "$base_missing") at the baseline"
              if [ -n "$unknown" ]; then
                summary="**Incomplete diff.** These didn't evaluate, so it can't say whether they change: $unknown."
              else
                summary="**Incomplete diff.** The baseline's evaluation failed, so none of this counts as the whole diff."
              fi
              case "$(count "$changed")" in
                0) summary="$summary"$'\n\n'"None of the hosts that did evaluate change." ;;
                1) summary="$summary"$'\n\n'"Of the hosts that did evaluate, 1 changes: $(list "$changed")" ;;
                *) summary="$summary"$'\n\n'"Of the hosts that did evaluate, $(count "$changed") change: $(list "$changed")" ;;
              esac
            fi
            if [ "$removed" != "[]" ]; then
              summary="$summary"$'\n\n'"Removed: $(list "$removed")"
            fi
          fi
          if [ "$BUILD" = true ] && [ "$LIST" = success ]; then
            builds=""
            [ "$built" = "[]" ] || builds="$builds"$'\n'"- Built and pushed to the cache: $(list "$built")"
            [ "$failed" = "[]" ] || builds="$builds"$'\n'"- **Failed to build or push:** $(list "$failed")"
            [ -z "$unbuilt" ] || builds="$builds"$'\n'"- Not built here: $unbuilt"
            [ -z "$builds" ] || summary="$summary"$'\n'"$builds"
          fi
          if [ "$unexplained" = true ]; then
            summary="$summary"$'\n\n'"**A host job failed** without leaving a record of which. The run's jobs say."
          fi

          if [ -z "$BASE" ]; then
            compared="There's no baseline, so every host counts as changed."
          else
            if [ "$EVENT" = pull_request ]; then against="its merge base"; else against="the commit before it"; fi
            if [ -n "$BASE_RUN" ]; then
              source="the mapping [run $BASE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASE_RUN) uploaded"
            else
              source="this run's evaluation"
            fi
            compared="Compared \`${HEAD::7}\` with $against \`${BASE::7}\`, from $source."
          fi
          printf '%s\n\n%s\n' "$summary" "$compared" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$summary" > summary.md

          ok=true
          if [ "$complete" != true ]; then
            ok=false
            echo "::error::An evaluation didn't pass, so the diff is incomplete."
          fi
          if [ "$failed" != "[]" ]; then
            ok=false
            echo "::error::$(list "$failed") didn't build or push."
          fi
          if [ "$unexplained" = true ]; then
            ok=false
            echo "::error::A host job failed (evaluate $EVALUATE) without saying which."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Gather the mapping
        id: mapping
        if: steps.diff.outputs.complete == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: cp "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/hosts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.mapping.outcome == 'success'
        with:
          name: hosts-${{ github.sha }}
          path: ${{ runner.temp }}/hosts.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Summarise the mapping
        if: steps.mapping.outcome == 'success'
        run: |
          echo "**Uploaded the mapping of $(jq length "$RUNNER_TEMP/hosts.json") hosts** as \`hosts-$GITHUB_SHA\`, for runs based on it." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: github.event_name == 'pull_request' && steps.diff.outcome == 'success'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Post the derivation diff
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '<!-- derivation-diff -->\n### Derivation diff\n\n%s\n\n<sub>Updated for %s by [run #%s](%s).</sub>' \
            "$(< "$RUNNER_TEMP/summary.md")" "${HEAD::7}" "$GITHUB_RUN_NUMBER" "$run")"
          api="repos/$GITHUB_REPOSITORY/issues"
          ids="$(gh api --paginate "$api/$NUMBER/comments" \
            --jq '.[] | select(.user.login == env.LOGIN and (.body | startswith("<!-- derivation-diff -->"))) | .id')"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api -X PATCH "$api/comments/$id" -f body="$body" > /dev/null
            echo "Updated the derivation diff comment on pull request #$NUMBER."
          else
            gh api "$api/$NUMBER/comments" -f body="$body" > /dev/null
            echo "Posted the derivation diff comment on pull request #$NUMBER."
          fi

      - name: Fail if anything did
        if: steps.diff.outputs.ok != 'true'
        run: exit 1
