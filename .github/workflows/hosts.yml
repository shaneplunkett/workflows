# Works out the caller's derivation diff on GitHub: the hosts whose system
# derivation differs between a pull request's merge base and its head. A
# whole colmena hive can outgrow a hosted runner's 16 GB, so each host is
# evaluated on its own runner, and the hosts job gathers them. On a pull
# request it compares them with the mapping main uploaded for the merge base
# and posts the diff as one comment from the caller's GitHub App, edited on
# each push. A merge base with no mapping is evaluated too, after the head.
# On a push to main it uploads the mapping as an artifact named for the
# commit. It builds nothing.
on:
  workflow_call:
    secrets:
      INPUTS_TOKEN:
        required: true
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.head.outputs.hosts }}
      base: ${{ steps.base.outputs.sha }}
      base-run: ${{ steps.base.outputs.run }}
      base-hosts: ${{ steps.base.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: List every host
        id: head
        run: echo "hosts=$(nix eval --json .#hydraJobs --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
      - name: Find main's mapping for the merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq .merge_base_commit.sha)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          # Only a push to main uploads a mapping, and only main's runs are
          # trusted, since a pull request's run could upload one by the same
          # name.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hosts-$base" --jq '
            [.artifacts[] | select((.expired | not)
              and .workflow_run.head_branch == env.MAIN
              and .workflow_run.head_repository_id == .workflow_run.repository_id)]
            | .[0].workflow_run.id // empty')"
          if [ -n "$run" ]; then
            echo "Using the mapping run $run uploaded for $base."
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            echo "No mapping for $base, so it's evaluated after the head."
            echo "hosts=$(nix eval --json "github:$GITHUB_REPOSITORY/$base#hydraJobs" --apply builtins.attrNames)" \
              >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host }}
      SIDE: head
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps: &evaluate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: Evaluate
        run: |
          out="$(mktemp -d)"
          status=0
          /usr/bin/time -f '%M %e' -o "$out/stats" \
            nix eval --raw ".#hydraJobs.$HOST.drvPath" > "$out/drv" || status=$?
          read -r rss elapsed < <(tail -1 "$out/stats")
          peak="$(awk -v kb="$rss" 'BEGIN { printf "%.2f GiB", kb / 1048576 }')"
          if [ "$status" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/drv"
            jq -n --arg host "$HOST" --rawfile drv "$out/drv" '{($host): $drv}' > "$RUNNER_TEMP/drv/$HOST.json"
            drv="\`$(< "$out/drv")\`"
          else
            drv="evaluation failed with status $status"
          fi
          echo "$HOST at the $SIDE: $drv, peak $peak, elapsed ${elapsed}s"
          {
            echo "### $HOST at the $SIDE"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$REF\` |"
            echo "| Derivation | $drv |"
            echo "| Peak memory | $peak |"
            echo "| Elapsed | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SIDE }}-${{ env.HOST }}
          path: ${{ runner.temp }}/drv/${{ env.HOST }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Runs after the head rather than beside it, so a pull request with no
  # mapping for its base never holds two matrices' worth of runners at once.
  evaluate-base:
    needs: [list, evaluate]
    if: needs.list.outputs.base != '' && needs.list.outputs.base-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.base-hosts) }}
    env:
      HOST: ${{ matrix.host }}
      SIDE: base
      REF: ${{ needs.list.outputs.base }}
    steps: *evaluate

  hosts:
    needs: [list, evaluate, evaluate-base]
    # A skipped job passes as a required check, so this one runs whatever
    # happened before it and fails itself when an evaluation did.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every evaluation passed
        env:
          LIST: ${{ needs.list.result }}
          HEAD: ${{ needs.evaluate.result }}
          BASE: ${{ needs.evaluate-base.result }}
        run: |
          if [ "$LIST" != success ] || [ "$HEAD" != success ] || { [ "$BASE" != success ] && [ "$BASE" != skipped ]; }; then
            echo "::error::An evaluation didn't pass (list $LIST, head $HEAD, base $BASE), so there's no diff."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: head-*
          merge-multiple: true
          path: ${{ runner.temp }}/head

      - name: Gather the mapping
        id: mapping
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: jq -s add "$RUNNER_TEMP"/head/*.json > "$RUNNER_TEMP/hosts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.mapping.outcome == 'success'
        with:
          name: hosts-${{ github.sha }}
          path: ${{ runner.temp }}/hosts.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Summarise the mapping
        if: steps.mapping.outcome == 'success'
        run: |
          echo "**Uploaded the mapping of $(jq length "$RUNNER_TEMP/hosts.json") hosts** as \`hosts-$GITHUB_SHA\`, for pull requests based on it." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.list.outputs.base-run != ''
        with:
          name: hosts-${{ needs.list.outputs.base }}
          run-id: ${{ needs.list.outputs.base-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/base
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.evaluate-base.result == 'success'
        with:
          pattern: base-*
          merge-multiple: true
          path: ${{ runner.temp }}/base

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: github.event_name == 'pull_request'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Post the derivation diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ needs.list.outputs.base }}
          BASE_RUN: ${{ needs.list.outputs.base-run }}
        run: |
          jq -s add "$RUNNER_TEMP"/head/*.json > "$RUNNER_TEMP/head.json"
          jq -s add "$RUNNER_TEMP"/base/*.json > "$RUNNER_TEMP/base.json"
          changed="$(jq -c --slurpfile base "$RUNNER_TEMP/base.json" \
            '[to_entries[] | select(.value != $base[0][.key]) | .key]' "$RUNNER_TEMP/head.json")"
          removed="$(jq -c --slurpfile head "$RUNNER_TEMP/head.json" \
            '[keys[] | select(in($head[0]) | not)]' "$RUNNER_TEMP/base.json")"
          echo "Changed: $changed"
          echo "Removed: $removed"

          list() { jq -r 'map("`\(.)`") | join(", ")' <<< "$1"; }
          case "$(jq length <<< "$changed")" in
            0) summary="**No hosts change.**" ;;
            1) summary="**1 host changes:** $(list "$changed")" ;;
            *) summary="**$(jq length <<< "$changed") hosts change:** $(list "$changed")" ;;
          esac
          if [ "$removed" != "[]" ]; then
            summary="$summary"$'\n\n'"Removed: $(list "$removed")"
          fi
          if [ -n "$BASE_RUN" ]; then
            source="the mapping [run $BASE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASE_RUN) uploaded"
          else
            source="this run's evaluation"
          fi
          {
            echo "$summary"
            echo
            echo "Compared \`${HEAD::7}\` with its merge base \`${BASE::7}\`, from $source."
          } >> "$GITHUB_STEP_SUMMARY"

          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '<!-- derivation-diff -->\n### Derivation diff\n\n%s\n\n<sub>Updated for %s by [run #%s](%s).</sub>' \
            "$summary" "${HEAD::7}" "$GITHUB_RUN_NUMBER" "$run")"
          api="repos/$GITHUB_REPOSITORY/issues"
          ids="$(gh api --paginate "$api/$NUMBER/comments" \
            --jq '.[] | select(.user.login == env.LOGIN and (.body | startswith("<!-- derivation-diff -->"))) | .id')"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api -X PATCH "$api/comments/$id" -f body="$body" > /dev/null
            echo "Updated the derivation diff comment on pull request #$NUMBER."
          else
            gh api "$api/$NUMBER/comments" -f body="$body" > /dev/null
            echo "Posted the derivation diff comment on pull request #$NUMBER."
          fi
