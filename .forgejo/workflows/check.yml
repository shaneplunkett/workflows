# Runs the caller's scripts/check.sh in its flake's dev shell: the same gate
# its agents' hooks and pre-commit run, so nothing they'd have caught lands
# by a route that skips them.
on:
  workflow_call:

jobs:
  check:
    runs-on: nix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: scripts/check.sh
        run: nix --option warn-dirty false develop --command scripts/check.sh
